name: arbit-dev
services:
  postgres:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: arbit_local
      POSTGRES_PASSWORD: arbit-local-dev-only
      POSTGRES_DB: arbit_local
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbit_local -d arbit_local"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
