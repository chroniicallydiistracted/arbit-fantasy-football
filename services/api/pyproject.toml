[project]
name = "arbit-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arbit-core",
    "arbit-data",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic-settings>=2.11,<3",
    "authlib==1.9.1",
    "httpx2>=2.16,<3",
    "joserfc>=1.7.3,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
arbit-core = { workspace = true }
arbit-data = { workspace = true }
