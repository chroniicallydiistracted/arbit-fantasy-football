name: Context governance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned (same as foundation workflow)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reference records
        run: |
          python3 scripts/validate_foundation.py
          python3 scripts/governance.py doctor
          python3 -m unittest discover -s tests/governance -p 'test_*.py'
      - name: Require closed task and handoff covering PR changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/governance.py diff-gate --base "$PR_BASE_SHA"
