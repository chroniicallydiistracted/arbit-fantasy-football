name: Runtime validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: arbit_local
          POSTGRES_PASSWORD: arbit-local-dev-only
          POSTGRES_DB: arbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbit_local -d arbit_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      ARBIT_TEST_DATABASE_URL: postgresql+psycopg://arbit_local:arbit-local-dev-only@127.0.0.1:5432/arbit_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.11.33
          enable-cache: true
      - name: Install frozen dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile
      - name: Validate runtime and foundation
        run: make runtime-check
